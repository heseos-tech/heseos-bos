<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Heseos Partner</title>
<!--
  Capacitor's server.errorPath fallback (see capacitor.config.ts) — shown by the native
  WebView itself when it can't load the live app shell from heseos-bos-psi.vercel.app (no
  connection, DNS/TLS failure, a too-old WebView, a slow network that never completes, etc.),
  instead of the blank white screen that WebView leaves behind by default on a failed/slow
  load. Per Capacitor's docs, a file used this way has no access to Capacitor plugins or the
  app's own JS — it's plain, self-contained HTML with the production URL hardcoded below, kept
  in sync with capacitor.config.ts's server.url by hand.
-->
<style>
  html, body { margin: 0; height: 100%; background: #060f1c; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .wrap { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px; text-align: center; box-sizing: border-box; }
  .badge { width: 64px; height: 64px; border-radius: 20px; background: #12283f; border: 1px solid #1b2f45; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
  h1 { color: #fff; font-size: 17px; font-weight: 700; margin: 0 0 8px; }
  p { color: #a9b8c9; font-size: 13.5px; line-height: 1.5; margin: 0 0 24px; max-width: 280px; }
  button { appearance: none; border: none; border-radius: 999px; background: #ff7a00; color: #fff; font-size: 14.5px; font-weight: 700; padding: 13px 28px; font-family: inherit; }
  button:active { opacity: 0.85; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="badge">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ff7a00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 9a16 16 0 0 1 22 0M5 13a10.5 10.5 0 0 1 14 0M8.5 17a5.5 5.5 0 0 1 7 0" />
        <line x1="12" y1="21" x2="12.01" y2="21" />
      </svg>
    </div>
    <h1>Can't connect right now</h1>
    <p>Check your internet connection and try again.</p>
    <button onclick="location.href='https://heseos-bos-psi.vercel.app/partner'">Try Again</button>
  </div>
</body>
</html>
